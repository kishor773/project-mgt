<form [formGroup]="orgForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 1.5rem;">
  
  <div style="display: flex; flex-direction: column; gap: 0.5rem;">
    <label for="name" style="font-weight: 500;">Organization Name *</label>
    <input pInputText id="name" formControlName="name" placeholder="e.g. Acme Corp" style="width: 100%;" />
  </div>

  <div style="display: flex; flex-direction: column; gap: 0.5rem;">
    <label for="slug" style="font-weight: 500;">Slug *</label>
    <input pInputText id="slug" formControlName="slug" placeholder="e.g. acme-corp" style="width: 100%;" />
  </div>

  <div style="display: flex; flex-direction: column; gap: 0.5rem;">
    <label for="logo_url" style="font-weight: 500;">Logo URL</label>
    <input pInputText id="logo_url" formControlName="logo_url" placeholder="https://..." style="width: 100%;" />
  </div>

  <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem;">
    <p-button label="Cancel" severity="secondary" [text]="true" (onClick)="close.emit()"></p-button>
    <p-button [label]="isSubmitting ? 'Saving...' : 'Save Organization'" type="submit" [disabled]="orgForm.invalid || isSubmitting"></p-button>
  </div>
</form>
