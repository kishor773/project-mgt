<div class="page-container">
  <div class="page-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <div>
      <h2 style="margin-bottom: 0.5rem; font-size: 1.5rem;">Organizations</h2>
      <p style="color: var(--text-secondary); margin: 0;">Manage companies and their workspaces.</p>
    </div>
    <button class="btn-primary" (click)="showModal = true" style="padding: 0.5rem 1rem; border-radius: 4px; background: var(--primary-color); color: white; border: none; cursor: pointer;">
      <i class="pi pi-plus" style="margin-right: 0.5rem;"></i> Add Organization
    </button>
  </div>

  <div class="glass-panel" style="padding: 1.5rem; border-radius: 12px; background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <table style="width: 100%; border-collapse: collapse; text-align: left;">
      <thead>
        <tr style="border-bottom: 2px solid rgba(0,0,0,0.05);">
          <th style="padding: 1rem;">Name</th>
          <th style="padding: 1rem;">Slug</th>
          <th style="padding: 1rem;">Members</th>
          <th style="padding: 1rem;">Status</th>
          <th style="padding: 1rem; text-align: center;">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let org of organizations" style="border-bottom: 1px solid rgba(0,0,0,0.05);">
          <td style="padding: 1rem;"><strong style="font-weight: 500;">{{ org.name }}</strong></td>
          <td style="padding: 1rem;"><code style="background: var(--bg-color); padding: 0.2rem 0.5rem; border-radius: 4px;">{{ org.slug }}</code></td>
          <td style="padding: 1rem;">{{ org.members }}</td>
          <td style="padding: 1rem;">
            <span style="padding: 0.25rem 0.5rem; border-radius: 12px; font-size: 0.85rem; font-weight: 600;"
                  [ngStyle]="{'background': org.status === 'Active' ? '#dcfce7' : '#fef08a', 'color': org.status === 'Active' ? '#166534' : '#854d0e'}">
              {{ org.status }}
            </span>
          </td>
          <td style="padding: 1rem; text-align: center;">
            <button style="background: transparent; border: none; cursor: pointer; color: var(--text-secondary); margin-right: 0.5rem;"><i class="pi pi-pencil"></i></button>
            <button style="background: transparent; border: none; cursor: pointer; color: #ef4444;"><i class="pi pi-trash"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" *ngIf="showModal" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px);">
  <div class="modal-content" style="background: white; padding: 2rem; border-radius: 12px; width: 450px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
      <h3 style="margin: 0;">Add New Organization</h3>
      <button (click)="showModal = false" style="background: transparent; border: none; font-size: 1.2rem; cursor: pointer;">&times;</button>
    </div>
    <app-organization-form 
      (close)="showModal = false" 
      (saved)="showModal = false; loadOrganizations()">
    </app-organization-form>
  </div>
</div>
