<div class="page-container">
  <div
    class="page-header"
    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem"
  >
    <div>
      <h2 style="margin-bottom: 0.5rem; font-size: 1.5rem">Users</h2>
      <p style="color: var(--text-secondary); margin: 0">Manage system users and access roles.</p>
    </div>
    <button pButton class="" (click)="showModal = true">
      <i class="pi pi-user-plus" style="margin-right: 0.5rem"></i> Invite User
    </button>
  </div>

  <div
    *ngIf="!loading && users.length >= 0"
    class="glass-panel"
    style="
      padding: 1.5rem;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    "
  >
    <p-table
      #dt
      [value]="users"
      dataKey="id"
      [rows]="10"
      [paginator]="true"
      [globalFilterFields]="['first_name', 'last_name', 'email', 'role']"
      variant="flat"
      [tableStyle]="{ width: '100%', 'border-collapse': 'collapse' }"
    >
      <ng-template #caption>
        <div class="flex justify-end pb-4">
          <p-iconfield iconPosition="left">
            <p-inputicon>
              <i class="pi pi-search"></i>
            </p-inputicon>
            <input
              pInputText
              type="text"
              (input)="dt.filterGlobal($event.target.value, 'contains')"
              placeholder="Search users..."
              style="
                background: rgba(255, 255, 255, 0.5);
                border-radius: 8px;
                border: 1px solid rgba(0, 0, 0, 0.1);
              "
            />
          </p-iconfield>
        </div>
      </ng-template>

      <ng-template #header>
        <tr style="border-bottom: 2px solid rgba(0, 0, 0, 0.05)">
          <th pSortableColumn="first_name" style="padding: 1rem">
            <div class="flex items-center justify-between">
              Name
              <div class="flex items-center">
                <p-sortIcon field="first_name" />
                <p-columnFilter type="text" field="first_name" display="menu" />
              </div>
            </div>
          </th>
          <th pSortableColumn="email" style="padding: 1rem">
            <div class="flex items-center justify-between">
              Email
              <div class="flex items-center">
                <p-sortIcon field="email" />
                <p-columnFilter type="text" field="email" display="menu" />
              </div>
            </div>
          </th>
          <th style="padding: 1rem">
            <div class="flex items-center justify-between">
              Role
              <p-columnFilter type="text" field="role" display="menu" />
            </div>
          </th>
          <th style="padding: 1rem">
            <div class="flex items-center justify-between">
              Status
              <p-columnFilter type="text" field="status" display="menu" />
            </div>
          </th>
          <th style="padding: 1rem; text-align: center">Actions</th>
        </tr>
      </ng-template>

      <ng-template #body let-user>
        <tr style="border-bottom: 1px solid rgba(0, 0, 0, 0.05); background: transparent">
          <td style="padding: 1rem">
            <div style="display: flex; align-items: center; gap: 0.75rem">
              <div
                style="
                  width: 32px;
                  height: 32px;
                  border-radius: 50%;
                  background: #007bff;
                  color: white;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-weight: bold;
                  font-size: 0.9rem;
                "
              >
                {{ user.first_name ? user.first_name.charAt(0) : 'U' }}
              </div>
              <strong style="font-weight: 500">{{ user.first_name }} {{ user.last_name }}</strong>
            </div>
          </td>
          <td style="padding: 1rem">{{ user.email }}</td>
          <td style="padding: 1rem">
            <span
              style="
                background: #e0f2fe;
                color: #0284c7;
                padding: 0.25rem 0.5rem;
                border-radius: 12px;
                font-size: 0.85rem;
                font-weight: 600;
              "
            >
              {{ user.role }}
            </span>
          </td>
          <td style="padding: 1rem">
            <span
              style="
                padding: 0.25rem 0.5rem;
                border-radius: 12px;
                font-size: 0.85rem;
                font-weight: 600;
              "
              [ngStyle]="{
                background: user.status === 'active' ? '#dcfce7' : '#fef08a',
                color: user.status === 'active' ? '#166534' : '#854d0e',
              }"
            >
              {{ user.status }}
            </span>
          </td>
          <td style="padding: 1rem; text-align: center">
            <p-button icon="pi pi-pencil" [text]="true" severity="secondary" />
            <p-button icon="pi pi-trash" [text]="true" severity="danger" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<div *ngIf="showModal">
  <p-dialog
    header="Add New User"
    [modal]="true"
    [(visible)]="showModal"
    [style]="{ width: '30rem', height: 'auto' }"
    [closable]="false"
    [dismissableMask]="true"
    [focusOnShow]="false"
  >
    <app-user-form
      *ngIf="showModal"
      (close)="showModal = false"
      (saved)="showModal = false; loadUsers()"
    >
    </app-user-form>
  </p-dialog>
</div>
