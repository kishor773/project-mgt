<div class="page-container">
  <div class="page-header"
    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <div>
      <h2 style="margin-bottom: 0.5rem; font-size: 1.5rem;">Users</h2>
      <p style="color: var(--text-secondary); margin: 0;">Manage system users and access roles.</p>
    </div>
    <button class="btn-primary" (click)="showModal = true"
      style="padding: 0.5rem 1rem; border-radius: 4px; background: var(--primary-color); color: white; border: none; cursor: pointer;">
      <i class="pi pi-user-plus" style="margin-right: 0.5rem;"></i> Invite User
    </button>
  </div>

  <div class="glass-panel"
    style="padding: 1.5rem; border-radius: 12px; background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <table style="width: 100%; border-collapse: collapse; text-align: left;">
      <thead>
        <tr style="border-bottom: 2px solid rgba(0,0,0,0.05);">
          <th style="padding: 1rem;">Name</th>
          <th style="padding: 1rem;">Email</th>
          <th style="padding: 1rem;">Role</th>
          <th style="padding: 1rem;">Status</th>
          <th style="padding: 1rem; text-align: center;">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users" style="border-bottom: 1px solid rgba(0,0,0,0.05);">
          <td style="padding: 1rem;">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <div
                style="width: 32px; height: 32px; border-radius: 50%; background: var(--primary-color); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem;">
                {{ user.first_name ? user.first_name.charAt(0) : 'U' }}
              </div>
              <strong style="font-weight: 500;">{{ user.first_name }} {{ user.last_name }}</strong>
            </div>
          </td>
          <td style="padding: 1rem;">{{ user.email }}</td>
          <td style="padding: 1rem;"><span
              style="background: #e0f2fe; color: #0284c7; padding: 0.25rem 0.5rem; border-radius: 12px; font-size: 0.85rem; font-weight: 600;">{{
              user.role }}</span></td>
          <td style="padding: 1rem;">
            <span style="padding: 0.25rem 0.5rem; border-radius: 12px; font-size: 0.85rem; font-weight: 600;"
              [ngStyle]="{'background': user.status === 'active' ? '#dcfce7' : '#fef08a', 'color': user.status === 'active' ? '#166534' : '#854d0e'}">
              {{ user.status }}
            </span>
          </td>
          <td style="padding: 1rem; text-align: center;">
            <button style="background: transparent; border: none; cursor: pointer; color: var(--text-secondary);"><i
                class="pi pi-pencil"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<p-dialog header="Add New User" [modal]="true" [(visible)]="showModal" [style]="{ width: '30rem' }">
  <app-user-form (close)="showModal = false" (saved)="showModal = false; loadUsers()">
  </app-user-form>
</p-dialog>
