<div class="dashboard-container">
  <header class="page-header">
    <div>
      <h1>Welcome back, Admin!</h1>
      <p>Here's what's happening with your projects today.</p>
    </div>
    <button class="btn-primary glass-panel">
      <i class="pi pi-plus"></i> New Project
    </button>
  </header>

  <div class="stats-grid">
    <div *ngFor="let stat of stats" class="stat-card glass-panel">
      <div class="stat-icon" [style.backgroundColor]="stat.color + '20'" [style.color]="stat.color">
        <i [class]="stat.icon"></i>
      </div>
      <div class="stat-details">
        <span class="stat-value">{{ stat.value }}</span>
        <span class="stat-label">{{ stat.label }}</span>
      </div>
    </div>
  </div>

  <div class="dashboard-content">
    <div class="recent-projects glass-panel">
      <h3>Recent Projects</h3>
      <div class="placeholder-content">
        <i class="pi pi-briefcase"></i>
        <p>No recent projects to display</p>
      </div>
    </div>
    <div class="upcoming-tasks glass-panel">
      <h3>My Tasks</h3>
      <div class="placeholder-content">
        <i class="pi pi-check-circle"></i>
        <p>You're all caught up!</p>
      </div>
    </div>
  </div>
</div>
